<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4a220f" />
      <stop offset="60%" stop-color="#231007" />
      <stop offset="100%" stop-color="#140703" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="blueBalloon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#F59E0B" stroke-width="6" opacity="0.4" />

  <!-- Carnival Awning at Top -->
  <g opacity="0.95">
    <path d="M 40 40 L 472 40 L 472 90 Q 450 110 430 90 Q 408 110 386 90 Q 364 110 342 90 Q 320 110 298 90 Q 276 110 256 90 Q 236 110 214 90 Q 192 110 170 90 Q 148 110 126 90 Q 104 110 82 90 Q 60 110 40 90 Z" fill="#DC2626" />
    <path d="M 82 40 L 126 40 L 126 90 Q 104 110 82 90 Z" fill="#FBBF24" />
    <path d="M 170 40 L 214 40 L 214 90 Q 192 110 170 90 Z" fill="#FBBF24" />
    <path d="M 256 40 L 298 40 L 298 90 Q 276 110 256 90 Z" fill="#FBBF24" />
    <path d="M 342 40 L 386 40 L 386 90 Q 364 110 342 90 Z" fill="#FBBF24" />
    <path d="M 430 40 L 472 40 L 472 90 Q 450 110 430 90 Z" fill="#FBBF24" />
  </g>

  <!-- Blue Balloon behind duck -->
  <g transform="translate(110, 150)">
    <path d="M 60 140 Q 65 170 58 195" stroke="#CBD5E1" stroke-width="3" fill="none" opacity="0.7" />
    <ellipse cx="60" cy="80" rx="55" ry="65" fill="url(#blueBalloon)" />
    <ellipse cx="40" cy="55" rx="14" ry="24" fill="#93C5FD" opacity="0.6" transform="rotate(-25 40 55)" />
  </g>

  <!-- Red Balloon behind duck -->
  <g transform="translate(260, 130)">
    <path d="M 70 150 Q 75 180 70 205" stroke="#CBD5E1" stroke-width="3" fill="none" opacity="0.7" />
    <ellipse cx="70" cy="85" rx="60" ry="70" fill="url(#redBalloon)" />
    <ellipse cx="48" cy="60" rx="16" ry="26" fill="#FCA5A5" opacity="0.65" transform="rotate(-25 48 60)" />
  </g>

  <!-- Cute Yellow Duck with Crown -->
  <g transform="translate(130, 210)">
    <!-- Duck Body -->
    <ellipse cx="120" cy="160" rx="95" ry="65" fill="url(#goldGrad)" stroke="#B45309" stroke-width="6" />
    <!-- Tail -->
    <path d="M 30 145 Q 8 110 38 125 Z" fill="#F59E0B" stroke="#B45309" stroke-width="5" />
    <!-- Wing -->
    <path d="M 80 155 Q 125 130 135 175 Q 95 185 80 155 Z" fill="#FEF08A" stroke="#B45309" stroke-width="5" />
    <!-- Head -->
    <circle cx="180" cy="105" r="50" fill="url(#goldGrad)" stroke="#B45309" stroke-width="6" />
    <!-- Eye with Sparkle -->
    <circle cx="195" cy="95" r="10" fill="#1E293B" />
    <circle cx="199" cy="91" r="3.5" fill="#FFFFFF" />
    <!-- Cheek Blush -->
    <circle cx="175" cy="122" r="12" fill="#FB7185" opacity="0.6" />
    <!-- Beak -->
    <ellipse cx="230" cy="115" rx="26" ry="14" fill="#EA580C" stroke="#9A3412" stroke-width="5" />
    <!-- Golden Royal Crown -->
    <polygon points="160,55 170,72 185,52 200,72 210,55 212,80 158,80" fill="#FDE047" stroke="#B45309" stroke-width="4" />
    <!-- Track Roller Carriage Base -->
    <rect x="65" y="222" width="120" height="20" rx="6" fill="#451A03" stroke="#F59E0B" stroke-width="3" />
    <circle cx="95" cy="232" r="6" fill="#E2E8F0" />
    <circle cx="155" cy="232" r="6" fill="#E2E8F0" />
  </g>

  <!-- Crosshair Reticle Targeting (Target Lock) -->
  <g transform="translate(256, 260)" filter="url(#glow)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#EF4444" stroke-width="6" stroke-dasharray="14 10" opacity="0.85" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#EF4444" stroke-width="4" opacity="0.9" />
    <line x1="-160" y1="0" x2="-85" y2="0" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
    <line x1="85" y1="0" x2="160" y2="0" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="-160" x2="0" y2="-85" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
    <line x1="0" y1="85" x2="0" y2="160" stroke="#EF4444" stroke-width="5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="12" fill="#EF4444" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Sparkle Stars -->
  <g fill="#FDE047">
    <path d="M 90 280 Q 95 295 110 300 Q 95 305 90 320 Q 85 305 70 300 Q 85 295 90 280 Z" />
    <path d="M 420 180 Q 424 192 436 196 Q 424 200 420 212 Q 416 200 404 196 Q 416 192 420 180 Z" />
  </g>

  <!-- Bottom Night Market Text Tag -->
  <g transform="translate(256, 465)">
    <rect x="-90" y="-18" width="180" height="30" rx="15" fill="#78350F" stroke="#FBBF24" stroke-width="2" />
    <text x="0" y="3" text-anchor="middle" fill="#FEF08A" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="2">夜市神射手</text>
  </g>
</svg>
